name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: List files
        run: |
          echo "Files in repository:"
          ls -lah

      - name: Extract project
        run: |
          mkdir app_project
          unzip -q "Alabbas-cricket-mithial(6).zip" -d app_project
          echo "Extracted files:"
          find app_project -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle
        run: |
          find app_project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find app_project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found in the ZIP."
            exit 1
          fi
          chmod +x "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alabbas-Cricket-APK
          path: app_project/**/build/outputs/apk/debug/*.apk
