name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Extract ZIP
        run: unzip -q "Alabbas-cricket-mithial(6).zip" -d app_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle
        run: find app_project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find app_project -name gradlew -type f | head -1)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alabbas-Cricket-APK
          path: app_project/**/build/outputs/apk/debug/*.apk
